<!--
  El icono de Wallai: la marca sobre el lima, listo para usar como avatar,
  favicon o icono de app. El redondeo de las esquinas es del 22%, que es el que
  usan iOS y Android para sus mascaras; dejarlo escrito aca hace que el SVG se
  vea igual en una pagina web, donde nadie le aplica ninguna mascara.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Wallai">
  <rect width="100" height="100" rx="22" fill="#AAFF4D"/>
  <path d="M 23 32 L 37 70 L 50 40 L 63 70 L 79 22" fill="none" stroke="#0C0C13"
        stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
